<!-- 🔔 Notification Bell — Alerte nouveaux créneaux -->
<script>
(function(){
  var CCT_ALERT_API="https://script.google.com/macros/s/AKfycbxWcFlv8c7niV5PJKfNTqR3Nv34XPpWlXiyIjqHuuenIarP3pxCwfX5_ATn2CVCbd8F5w/exec";
  var LS_KEY="mlpadel_alert_subscribed";
  var LS_EMAIL="mlpadel_alert_email";

  /* ── Styles ── */
  var style=document.createElement("style");
  style.textContent=`
    #mlp-bell-btn{position:fixed;bottom:88px;right:30px;width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#c9a84c,#e0cb82);color:#0a1628;border:none;cursor:pointer;z-index:999;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 4px 20px rgba(201,168,76,0.4);transition:all 0.3s;opacity:0;pointer-events:none;transform:translateY(20px)}
    #mlp-bell-btn.visible{opacity:1;pointer-events:auto;transform:translateY(0)}
    #mlp-bell-btn:hover{transform:translateY(-3px)!important;box-shadow:0 8px 30px rgba(201,168,76,0.6)}
    /* Sur mobile, empilée au-dessus de la flèche "retour en haut" (barre de nav basse) */
    @media(max-width:900px){
      #mlp-bell-btn{bottom:158px;right:16px;width:42px;height:42px;font-size:17px}
    }
    #mlp-bell-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:1000;align-items:center;justify-content:center}
    #mlp-bell-overlay.open{display:flex}
    #mlp-bell-card{background:#0a1628;border:2px solid #c9a84c;border-radius:16px;padding:32px 28px;max-width:380px;width:90%;color:#f5f2eb;text-align:center;position:relative;font-family:'Montserrat',sans-serif;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
    #mlp-bell-card h3{margin:0 0 8px;font-size:22px;color:#c9a84c}
    #mlp-bell-card p{margin:0 0 20px;font-size:14px;color:#d1cdc4;line-height:1.5}
    #mlp-bell-card input[type=email]{width:100%;padding:12px 16px;border:1px solid #c9a84c33;border-radius:10px;background:#111d30;color:#f5f2eb;font-size:15px;outline:none;box-sizing:border-box;margin-bottom:14px;font-family:'Montserrat',sans-serif}
    #mlp-bell-card input[type=email]::placeholder{color:#8a8577}
    #mlp-bell-card input[type=email]:focus{border-color:#c9a84c}
    #mlp-bell-sub-btn{width:100%;padding:12px;border:none;border-radius:10px;background:linear-gradient(135deg,#c9a84c,#e0cb82);color:#0a1628;font-size:15px;font-weight:700;cursor:pointer;font-family:'Montserrat',sans-serif;transition:opacity 0.3s}
    #mlp-bell-sub-btn:hover{opacity:0.9}
    #mlp-bell-sub-btn:disabled{opacity:0.6;cursor:wait}
    #mlp-bell-close{position:absolute;top:12px;right:16px;background:none;border:none;color:#8a8577;font-size:22px;cursor:pointer;padding:4px}
    #mlp-bell-close:hover{color:#f5f2eb}
    #mlp-bell-msg{margin-top:14px;font-size:13px;line-height:1.4}
    #mlp-bell-unsub{background:none;border:none;color:#c9a84c;cursor:pointer;font-size:13px;text-decoration:underline;margin-top:10px;font-family:'Montserrat',sans-serif}
    @media(max-width:480px){#mlp-bell-card{padding:24px 18px}}
  `;
  document.head.appendChild(style);

  /* ── Bell button ── */
  var bell=document.createElement("button");
  bell.id="mlp-bell-btn";
  bell.setAttribute("aria-label","Notifications");
  bell.innerHTML="🔔";
  document.body.appendChild(bell);

  /* ── Overlay + Card ── */
  var overlay=document.createElement("div");
  overlay.id="mlp-bell-overlay";
  overlay.innerHTML=`
    <div id="mlp-bell-card">
      <button id="mlp-bell-close">&times;</button>
      <div id="mlp-bell-content"></div>
    </div>
  `;
  document.body.appendChild(overlay);

  var content=document.getElementById("mlp-bell-content");

  function isSubscribed(){return localStorage.getItem(LS_KEY)==="1"}

  function renderForm(){
    content.innerHTML=`
      <h3>🔔 Restez informé</h3>
      <p>Recevez une alerte dès qu'un nouveau cours ou une nouveauté est disponible.</p>
      <input type="email" id="mlp-bell-email" placeholder="Votre email" required autocomplete="email"/>
      <button id="mlp-bell-sub-btn">S'abonner</button>
      <div id="mlp-bell-msg"></div>
    `;
    document.getElementById("mlp-bell-sub-btn").addEventListener("click",handleSubscribe);
    document.getElementById("mlp-bell-email").addEventListener("keydown",function(ev){if(ev.key==="Enter")handleSubscribe()});
  }

  function renderSubscribed(){
    var email=localStorage.getItem(LS_EMAIL)||"";
    content.innerHTML=`
      <h3>🔔 Vous êtes abonné ✓</h3>
      <p>Les alertes sont envoyées à<br/><strong>${email}</strong></p>
      <button id="mlp-bell-unsub">Se désabonner</button>
    `;
    document.getElementById("mlp-bell-unsub").addEventListener("click",handleUnsubscribe);
  }

  function handleSubscribe(){
    var input=document.getElementById("mlp-bell-email");
    var msg=document.getElementById("mlp-bell-msg");
    var btn=document.getElementById("mlp-bell-sub-btn");
    var email=input.value.trim();
    if(!email||!input.checkValidity()){msg.style.color="#e74c3c";msg.textContent="Veuillez entrer un email valide.";return}
    btn.disabled=true;btn.textContent="Envoi…";
    fetch(CCT_ALERT_API+"?action=alert_subscribe&email="+encodeURIComponent(email))
      .then(function(r){return r.json()})
      .then(function(d){
        if(d.success){
          localStorage.setItem(LS_KEY,"1");
          localStorage.setItem(LS_EMAIL,email);
          msg.style.color="#27ae60";
          msg.textContent="Vous êtes inscrit ! Vous recevrez les alertes par email.";
          setTimeout(renderSubscribed,1500);
        }else{msg.style.color="#e74c3c";msg.textContent=d.error||"Erreur, réessayez.";btn.disabled=false;btn.textContent="S'abonner"}
      })
      .catch(function(){msg.style.color="#e74c3c";msg.textContent="Erreur réseau, réessayez.";btn.disabled=false;btn.textContent="S'abonner"});
  }

  function handleUnsubscribe(){
    var email=localStorage.getItem(LS_EMAIL)||"";
    fetch(CCT_ALERT_API+"?action=alert_unsubscribe&email="+encodeURIComponent(email))
      .then(function(r){return r.json()})
      .then(function(){
        localStorage.removeItem(LS_KEY);
        localStorage.removeItem(LS_EMAIL);
        renderForm();
        var msg=document.getElementById("mlp-bell-msg");
        if(msg){msg.style.color="#c9a84c";msg.textContent="Vous avez été désabonné."}
      })
      .catch(function(){});
  }

  /* ── Show/hide bell with scroll (same threshold as back-to-top) ── */
  function toggleBellVisibility(){
    if(window.scrollY>600){bell.classList.add("visible")}else{bell.classList.remove("visible")}
  }
  window.addEventListener("scroll",toggleBellVisibility);
  toggleBellVisibility();

  /* ── Events ── */
  bell.addEventListener("click",function(){
    overlay.classList.add("open");
    if(isSubscribed()){renderSubscribed()}else{renderForm()}
  });
  document.getElementById("mlp-bell-close").addEventListener("click",function(){overlay.classList.remove("open")});
  overlay.addEventListener("click",function(ev){if(ev.target===overlay)overlay.classList.remove("open")});
})();
</script>


<!-- Scroll Reveal Animations -->
<script>
(function(){
  setTimeout(function(){
    var ids=['tarifs','wallet','galerie','cours-collectifs','boutique','faq','contact','reviews','\u00e9v\u00e9nements'];
    var transforms=['translateX(-40px)','translateX(40px)','translateY(40px)'];
    var animated=[];
    ids.forEach(function(id,i){
      var el=document.getElementById(id);
      if(!el)return;
      var rect=el.getBoundingClientRect();
      if(rect.top<window.innerHeight&&rect.bottom>0)return;
      el.style.opacity='0';
      el.style.transform=transforms[i%3];
      el.offsetHeight;
      el.style.transition='opacity 0.7s ease,transform 0.7s ease';
      animated.push(el);
    });
    var obs=new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if(e.isIntersecting){
          e.target.style.opacity='1';
          e.target.style.transform='translate(0,0)';
          obs.unobserve(e.target);
        }
      });
    },{threshold:0.1,rootMargin:'0px 0px -40px 0px'});
    animated.forEach(function(el){obs.observe(el)});
  },2000);
})();
</script>
<!-- GA4 Event Tracking -->
<script>
(function() {
  document.addEventListener("click", function(e) {
    var link = e.target.closest("a");
    if (!link) return;
    var href = link.getAttribute("href") || "";
    if (href.indexOf("cal.com") !== -1) {
      gtag("event", "clic_reserver", { event_category: "conversion", event_label: href });
    }
    if (href.indexOf("wa.me") !== -1) {
      gtag("event", "clic_whatsapp", { event_category: "conversion", event_label: "WhatsApp" });
    }
    if (href === "#wallet") {
      gtag("event", "acces_wallet", { event_category: "engagement", event_label: "Navigation Wallet" });
    }
    if (href.indexOf("pallap") !== -1) {
      gtag("event", "clic_boutique", { event_category: "engagement", event_label: href });
    }
  });
  var sections = ["tarifs","wallet","galerie","avis","academie","contact"];
  var observer = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (entry.isIntersecting) {
        gtag("event", "section_vue", { event_category: "engagement", event_label: entry.target.id });
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.3 });
  setTimeout(function() {
    sections.forEach(function(id) {
      var el = document.getElementById(id);
      if (el) observer.observe(el);
    });
  }, 2000);
})();
</script>

 
<script>
(function(){
  let clickCount=0,clickTimer=null;
  document.addEventListener('click',function(e){
    // Check if click is on the logo area (first link in nav pointing to #hero)
    const logoLink=document.querySelector('nav a[href="#hero"]');
    if(!logoLink)return;
    if(logoLink.contains(e.target)||e.target===logoLink){
      clickCount++;
      if(clickCount===1){clickTimer=setTimeout(function(){clickCount=0},600)}
      if(clickCount>=3){clearTimeout(clickTimer);clickCount=0;window.location.href='/system.html'}
    }
  });
})();
</script>
